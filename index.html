<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meteo Perfetto">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='49' fill='%23ffffff'/><polygon points='50,6 57,43 94,50 57,57 50,94 43,57 6,50 43,43' fill='%230a4bff'/><polygon points='50,43 74,26 57,50 74,74 50,57 26,74 43,50 26,26' fill='%236ea0ff'/><circle cx='50' cy='50' r='6' fill='%230a2fb0'/></svg>">
<title>Meteo Perfetto — Consenso multi-modello</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0b1220; --bg2:#111a2e; --card:#16223c; --card2:#1d2c4d;
    --txt:#eaf1ff; --mut:#9fb0d0; --acc:#4cc2ff; --acc2:#6ee7b7;
    --warn:#ffcf5c; --bad:#ff7a7a; --line:#26365c; --good:#6ee7b7;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%,#1b2a4d 0,var(--bg) 55%) fixed;
    color:var(--txt); min-height:100vh; padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto}
  .layout{display:flex;gap:16px;align-items:flex-start}
  .main{flex:1;min-width:0}
  .side{flex:0 0 300px;position:sticky;top:8px}
  header.app{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo svg{display:block;border-radius:50%;box-shadow:0 4px 14px rgba(10,75,255,.35)}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
  .sub{color:var(--mut);font-size:11px;margin-top:2px}
  .searchbar{display:flex;gap:8px;flex:1;min-width:220px;justify-content:flex-end;flex-wrap:wrap}
  input[type=text],input[type=password]{
    background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:10px 12px;border-radius:12px;font-size:14px;outline:none}
  #q{min-width:160px}
  input:focus{border-color:var(--acc)}
  button{
    background:var(--card2);color:var(--txt);border:1px solid var(--line);
    padding:10px 14px;border-radius:12px;font-size:14px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--acc)}
  button.primary{background:linear-gradient(135deg,var(--acc),#2b8bd6);border:0;color:#06121f;font-weight:700;display:inline-flex;align-items:center}
  .suggest{position:relative}
  .suglist{position:absolute;top:46px;right:0;background:var(--card);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;z-index:1200;min-width:260px;box-shadow:var(--shadow);display:none}
  .suglist div{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}
  .suglist div:hover{background:var(--card2)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px}
  .chip b{font-weight:600;cursor:pointer}
  .chip.ghost{background:var(--bg2)}
  .chip .x,.chip .pin{cursor:pointer;font-style:normal;line-height:1}
  .chip .x{color:var(--mut);font-size:16px}
  .chip .x:hover{color:var(--bad)}
  .chip .pin{color:var(--warn);font-size:14px}
  .rlbl{font-size:12px;color:var(--mut)}
  .placeline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .pname{font-weight:700;font-size:15px}
  .pinbtn{padding:5px 11px;font-size:12px;border-radius:999px}
  .pinned{font-size:12px;color:var(--warn)}
  .tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:rgba(11,18,32,.92);backdrop-filter:blur(6px);padding:8px 0;margin-bottom:12px;z-index:50;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;cursor:pointer;white-space:nowrap}
  .tab.active{background:linear-gradient(135deg,var(--acc),#2b8bd6);color:#06121f;border:0;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .now{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .now .ic{font-size:64px;line-height:1}
  .now .temp{font-size:54px;font-weight:800;line-height:1}
  .now .cond{font-size:15px;color:var(--mut)}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
  .pill{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;min-width:92px}
  .pill b{display:block;font-size:16px;margin-top:2px}
  .conf{margin-left:auto;text-align:right}
  .badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
  .b-high{background:rgba(110,231,183,.16);color:var(--good);border:1px solid rgba(110,231,183,.4)}
  .b-med{background:rgba(255,207,92,.16);color:var(--warn);border:1px solid rgba(255,207,92,.4)}
  .b-low{background:rgba(255,122,122,.16);color:var(--bad);border:1px solid rgba(255,122,122,.4)}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:4px 2px 12px}
  .daychips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
  .daychips::-webkit-scrollbar{display:none}
  .dchip{flex:0 0 auto;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:13px;cursor:pointer;text-align:center}
  .dchip.active{border-color:var(--acc);background:var(--card2)}
  .dchip small{display:block;color:var(--mut);font-size:11px}
  .hours{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .hcell{flex:0 0 auto;width:84px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
  .hcell .h{font-size:12px;color:var(--mut)}
  .hcell .e{font-size:24px;margin:4px 0}
  .hcell .t{font-size:18px;font-weight:700}
  .hcell .w{font-size:11px;color:var(--mut);margin-top:6px}
  .hcell .sea{font-size:11px;color:#7fd0ff;margin-top:5px}
  .hcell .sun{font-size:10px;color:var(--warn);margin-top:5px;font-weight:700}
  .hcell .tide{font-size:11px;color:#5fd0c0;margin-top:4px}
  .hcell .rain{font-size:11px;color:var(--acc);min-height:14px}
  .arrow{display:inline-block}
  .days{display:flex;flex-direction:column;gap:9px}
  .day{display:grid;grid-template-columns:120px 46px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
  .day:hover{border-color:var(--acc)}
  .day .dn{font-weight:700;text-transform:capitalize}
  .day .dd{font-size:12px;color:var(--mut)}
  .day .de{font-size:26px;text-align:center}
  .day .range{display:flex;align-items:center;gap:8px}
  .barT{height:6px;border-radius:6px;background:linear-gradient(90deg,#4cc2ff,#6ee7b7,#ffcf5c,#ff7a7a);flex:1;opacity:.5}
  .tmin{color:var(--acc)}.tmax{font-weight:700}
  .day .wind{font-size:12px;color:var(--mut);text-align:right;min-width:110px}
  .day .wind b{color:var(--txt)}
  .muted{color:var(--mut)}
  .loader{text-align:center;padding:40px;color:var(--mut)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{background:rgba(255,122,122,.12);border:1px solid var(--bad);color:#ffd9d9;padding:14px;border-radius:12px}
  .foot{color:var(--mut);font-size:11px;text-align:center;margin:16px 0 4px}
  .alert{display:flex;align-items:center;gap:10px;background:rgba(255,207,92,.12);border:1px solid rgba(255,207,92,.45);color:#ffe6a6;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px}
  .alert.red{background:rgba(255,122,122,.12);border-color:rgba(255,122,122,.5);color:#ffd9d9}
  .alert.ok{background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.4);color:#bff3dd}
  .moon{display:flex;align-items:center;gap:14px}
  .moon .mi{font-size:42px;line-height:1}
  #map{height:360px;width:100%;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .leaflet-container{background:#0b1220;font-family:inherit}
  .lock{position:fixed;inset:0;background:radial-gradient(1200px 700px at 50% 0,#1b2a4d,#0b1220);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}
  .lockbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
  .lockbox .lglogo{margin:0 auto 8px;border-radius:50%;box-shadow:0 6px 18px rgba(10,75,255,.4)}
  .lockbox .lglock{margin:0 auto;opacity:.92}
  .lockbox h2{margin:10px 0 4px;font-size:20px}
  .lockbox p{color:var(--mut);font-size:13px;margin:0 0 18px}
  .lockbox input{width:100%;text-align:center;letter-spacing:3px;margin-bottom:12px}
  .lockbox button{width:100%}
  .rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:14px;cursor:pointer}
  .rem input{width:auto;margin:0;letter-spacing:0}
  .lockerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
  @media(max-width:760px){
    .layout{flex-direction:column}
    .side{flex:0 0 auto;width:100%;position:static;order:-1}
    #map{height:220px}
  }
  @media(max-width:560px){
    .now .temp{font-size:46px}.now .ic{font-size:52px}
    .conf{margin-left:0;text-align:left;width:100%}
    .day{grid-template-columns:92px 38px 1fr}
    .day .wind{grid-column:1/-1;text-align:left;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;min-width:0}
    .searchbar{justify-content:flex-start}
  }
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="lockbox">
    <svg class="lglogo" viewBox="0 0 100 100" width="58" height="58" xmlns="http://www.w3.org/2000/svg" aria-label="Rosa dei venti"><circle cx="50" cy="50" r="49" fill="#ffffff"/><polygon points="50,6 57,43 94,50 57,57 50,94 43,57 6,50 43,43" fill="#0a4bff"/><polygon points="50,43 74,26 57,50 74,74 50,57 26,74 43,50 26,26" fill="#6ea0ff"/><circle cx="50" cy="50" r="6" fill="#0a2fb0"/></svg>
    <svg class="lglock" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    <h2>Meteo Perfetto</h2>
    <p>Inserisci la password per accedere</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" autocapitalize="characters">
    <label class="rem"><input type="checkbox" id="rem"> Ricorda la password su questo dispositivo</label>
    <button class="primary" id="pwBtn">Entra</button>
    <div class="lockerr" id="pwErr"></div>
  </div>
</div>

<div class="wrap">
  <header class="app">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 100 100" width="36" height="36" xmlns="http://www.w3.org/2000/svg" aria-label="Rosa dei venti"><circle cx="50" cy="50" r="49" fill="#ffffff"/><polygon points="50,6 57,43 94,50 57,57 50,94 43,57 6,50 43,43" fill="#0a4bff"/><polygon points="50,43 74,26 57,50 74,74 50,57 26,74 43,50 26,26" fill="#6ea0ff"/><circle cx="50" cy="50" r="6" fill="#0a2fb0"/></svg></div>
      <div><h1>Meteo Perfetto</h1><div class="sub">Consenso di tutte le fonti · vento in nodi</div></div>
    </div>
    <div class="searchbar">
      <button class="primary" id="geoBtn" title="Usa la mia posizione"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" style="vertical-align:-2px;margin-right:5px"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>Posizione</button>
      <div class="suggest"><input type="text" id="q" placeholder="Cerca città…" autocomplete="off"><div class="suglist" id="sug"></div></div>
    </div>
  </header>

  <div class="bar" id="favs"></div>
  <div class="bar" id="recent" style="display:none"></div>
  <div class="placeline" id="placeline"></div>
  <div class="layout">
    <div class="main">
      <div class="tabs" id="tabs" style="display:none"></div>
      <div id="content"><div class="loader"><div class="spin"></div>Avvio in corso…</div></div>
    </div>
    <aside class="side"><div id="map"></div></aside>
  </div>

  <div id="bottom"></div>

  <div class="foot">Dati Open-Meteo · consenso di tutte le fonti meteo mondiali. Mappa © OpenStreetMap.</div>
</div>

<script>
"use strict";

const MODELS = [
  {id:"ecmwf_ifs025"}, {id:"gfs_seamless"}, {id:"icon_seamless"},
  {id:"gem_seamless"}, {id:"meteofrance_seamless"}, {id:"jma_seamless"},
  {id:"metno_seamless"}, {id:"ukmo_seamless"}, {id:"knmi_seamless"},
  {id:"dmi_seamless"}, {id:"bom_access_global"}, {id:"cma_grapes_global"},
  {id:"gfs_graphcast025"}, {id:"italia_meteo_arpae_icon_2i"}
];
const HOURLY = ["temperature_2m","apparent_temperature","relative_humidity_2m","precipitation","precipitation_probability","weather_code","wind_speed_10m","wind_direction_10m","wind_gusts_10m"];
const DAILY  = ["weather_code","temperature_2m_max","temperature_2m_min","precipitation_sum","precipitation_probability_max","wind_speed_10m_max","wind_gusts_10m_max","wind_direction_10m_dominant","sunrise","sunset"];

const DEFAULT_FAVS=[
  {name:"Viserba (Rimini)",lat:44.0807,lon:12.5276},
  {name:"Rimini",lat:44.0594,lon:12.5683},
  {name:"Roma",lat:41.9028,lon:12.4964},
  {name:"Milano",lat:45.4642,lon:9.19},
  {name:"Bologna",lat:44.4949,lon:11.3426}
];

let STATE = {lat:null,lon:null,place:"",enabled:new Set(MODELS.map(m=>m.id)),data:null,marine:null,selDay:0,tab:"adesso",favs:[],recent:[]};

// ---- Util ----
const $ = s=>document.querySelector(s);
const compass = d=>{const dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];return dirs[Math.round(((d%360)/22.5))%16];};
const fromTxt = d=>"da "+compass(d);
const near = (a,b)=>Math.abs(a.lat-b.lat)<0.04 && Math.abs(a.lon-b.lon)<0.04;
function wmo(code){
  const m={0:["Sereno","☀️"],1:["Poco nuvoloso","🌤️"],2:["Parz. nuvoloso","⛅"],3:["Coperto","☁️"],
    45:["Nebbia","🌫️"],48:["Nebbia gelata","🌫️"],51:["Pioviggine","🌦️"],53:["Pioviggine","🌦️"],55:["Pioviggine","🌦️"],
    56:["Pioviggine gelata","🌧️"],57:["Pioviggine gelata","🌧️"],61:["Pioggia debole","🌧️"],63:["Pioggia","🌧️"],65:["Pioggia forte","🌧️"],
    66:["Pioggia gelata","🌧️"],67:["Pioggia gelata","🌧️"],71:["Neve debole","🌨️"],73:["Neve","🌨️"],75:["Neve forte","❄️"],77:["Nevischio","🌨️"],
    80:["Rovesci","🌦️"],81:["Rovesci","🌧️"],82:["Rovesci forti","⛈️"],85:["Rovesci di neve","🌨️"],86:["Rovesci di neve","🌨️"],
    95:["Temporale","⛈️"],96:["Temporale+grandine","⛈️"],99:["Temporale+grandine","⛈️"]};
  return m[code]||["—","❓"];
}
const hhmm = iso=> iso? new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : "—";
const mean = a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
const std = a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)));};
function circMean(degs){ if(!degs.length) return null; let x=0,y=0; degs.forEach(d=>{const r=d*Math.PI/180;x+=Math.cos(r);y+=Math.sin(r);}); let a=Math.atan2(y/degs.length,x/degs.length)*180/Math.PI; return (a+360)%360; }
function mode(arr){const c={};let best=arr[0],bc=0;arr.forEach(v=>{c[v]=(c[v]||0)+1;if(c[v]>bc){bc=c[v];best=v;}});return +best;}
function windArrow(deg){const to=(deg+180)%360;return `<span class="arrow" title="vento ${fromTxt(deg)}" style="transform:rotate(${to}deg)">↑</span>`;}
const ICON_SUNRISE=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#ffcf5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="2" x2="12" y2="9"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="8 6 12 2 16 6"/></svg>`;
const ICON_SUNSET=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#ffcf5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><line x1="23" y1="22" x2="1" y2="22"/><polyline points="16 5 12 9 8 5"/></svg>`;
function seaState(h){
  if(h==null||isNaN(h)) return null;
  if(h<0.10) return "Calmo"; if(h<0.50) return "Poco mosso"; if(h<1.25) return "Mosso";
  if(h<2.50) return "Molto mosso"; if(h<4.0) return "Agitato"; if(h<6.0) return "Molto agitato";
  if(h<9.0) return "Grosso"; if(h<14.0) return "Molto grosso"; return "Tempestoso";
}

// ---- Fetch ----
async function geocode(name){
  const u=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=6&language=it&format=json`;
  const r=await fetch(u); const j=await r.json(); return j.results||[];
}
async function loadWeather(lat,lon){
  const reqs = MODELS.map(async m=>{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      +`&hourly=${HOURLY.join(",")}&daily=${DAILY.join(",")}`
      +`&models=${m.id}&wind_speed_unit=kn&timezone=auto&forecast_days=7`;
    try{ const r=await fetch(u); if(!r.ok) return null; const j=await r.json(); j._id=m.id; return j; }
    catch(e){ return null; }
  });
  const ok = (await Promise.all(reqs)).filter(Boolean);
  if(!ok.length) throw new Error("nessuna fonte raggiungibile");
  const merged = {hourly:{}, daily:{}};
  const pick=(o,base,id)=> (o[base]!==undefined?o[base]:o[`${base}_${id}`]);
  ok.forEach(j=>{
    const id=j._id;
    if(j.hourly){ if(!merged.hourly.time) merged.hourly.time=j.hourly.time;
      HOURLY.forEach(b=>{const a=pick(j.hourly,b,id); if(a) merged.hourly[`${b}_${id}`]=a;}); }
    if(j.daily){ if(!merged.daily.time) merged.daily.time=j.daily.time;
      DAILY.forEach(b=>{const a=pick(j.daily,b,id); if(a) merged.daily[`${b}_${id}`]=a;}); }
  });
  return merged;
}
async function loadMarine(lat,lon){
  const uw=`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}`
    +`&hourly=wave_height,wave_direction,wave_period,swell_wave_height`
    +`&daily=wave_height_max,wave_direction_dominant,wave_period_max&timezone=auto&forecast_days=7`;
  let waves=null;
  try{ const r=await fetch(uw); if(r.ok){ const j=await r.json(); if(j.hourly&&j.hourly.wave_height&&j.hourly.wave_height.some(v=>v!=null)) waves=j; } }catch(e){}
  if(!waves) return null;
  // livello del mare (marea) in richiesta separata: se non supportato, le onde restano
  try{
    const ut=`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_level_height_msl&timezone=auto&forecast_days=7`;
    const r=await fetch(ut); if(r.ok){ const j=await r.json(); if(j.hourly&&j.hourly.sea_level_height_msl) waves.hourly.sea_level_height_msl=j.hourly.sea_level_height_msl; }
  }catch(e){}
  return waves;
}
function perModel(block, v){ const out={}; STATE.enabled.forEach(id=>{const k=block[`${v}_${id}`]; if(k!=null) out[id]=k;}); return out; }
function firstOf(block, v, i){ for(const id of STATE.enabled){const a=block[`${v}_${id}`]; if(a&&a[i]!=null) return a[i];} return null; }
function consensusAt(pm,i,circ=false){ const vals=[]; for(const id in pm){const v=pm[id][i]; if(v!=null&&!Number.isNaN(v)) vals.push(v);} if(!vals.length) return {v:null,vals:[],spread:0}; return {v:circ?circMean(vals):mean(vals),vals,spread:circ?0:std(vals)}; }
function confidence(t,w){ const s=t+w*0.4; if(s<1.5) return ["Alta","b-high"]; if(s<3.5) return ["Media","b-med"]; return ["Bassa","b-low"]; }

function prep(){

  const now=new Date(); let idxNow=0; for(let k=0;k<H.time.length;k++){ if(new Date(H.time[k])<=now) idxNow=k; else break; }
  return {H,D,idxNow,
    tH:perModel(H,"temperature_2m"),wsH:perModel(H,"wind_speed_10m"),wdH:perModel(H,"wind_direction_10m"),
    wgH:perModel(H,"wind_gusts_10m"),ppH:perModel(H,"precipitation_probability"),wcH:perModel(H,"weather_code"),
    apH:perModel(H,"apparent_temperature"),rhH:perModel(H,"relative_humidity_2m"),prH:perModel(H,"precipitation"),
    tmax:perModel(D,"temperature_2m_max"),tmin:perModel(D,"temperature_2m_min"),dwc:perModel(D,"weather_code"),
    dws:perModel(D,"wind_speed_10m_max"),dwg:perModel(D,"wind_gusts_10m_max"),dwd:perModel(D,"wind_direction_10m_dominant"),
    dpp:perModel(D,"precipitation_probability_max"),dps:perModel(D,"precipitation_sum")};
}
function codeAt(wc,i){ const cc=[]; for(const id in wc){const v=wc[id][i]; if(v!=null)cc.push(v);} return cc.length?mode(cc):0; }

        ${mn&&mn.tide?`<div class="pill">Marea <b>${mn.tide.kind==='high'?'Alta':mn.tide.kind==='low'?'Bassa':(mn.tide.trend>=0?'Montante':'Calante')}</b><span class="muted">${mn.tide.cur>=0?'+':''}${mn.tide.cur.toFixed(2)} m</span></div>`:''}

function buildDayChips(P){

function buildHourly(P){
  const date=P.D.time[STATE.selDay];
  let idxs=[]; for(let i=0;i<P.H.time.length;i++){ if(P.H.time[i].slice(0,10)===date) idxs.push(i); }
  if(STATE.selDay===0) idxs=idxs.filter(i=>i>=P.idxNow);
  const dt=new Date(date+"T12:00");
  const dn=STATE.selDay===0?"Oggi":(STATE.selDay===1?"Domani":dt.toLocaleDateString('it-IT',{weekday:'long'}));
  const mh=(STATE.marine&&STATE.marine.hourly)?STATE.marine.hourly:null;
  const slm=mh&&mh.sea_level_height_msl?mh.sea_level_height_msl:null;
  const sr=firstOf(P.D,"sunrise",STATE.selDay), ss=firstOf(P.D,"sunset",STATE.selDay);
  const srH=sr?new Date(sr).getHours():-1, ssH=ss?new Date(ss).getHours():-1;
  let h=buildDayChips(P)+`<div class="card"><h2 class="sec">🕐 Ora per ora · ${dn} ${dt.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</h2><div class="hours">`;

    const ct=consensusAt(P.tH,i),cw=consensusAt(P.wsH,i),cd=consensusAt(P.wdH,i,true),pp=consensusAt(P.ppH,i),pr=consensusAt(P.prH,i);
    let wave=null,wdir=null,tide=null;
    if(mh){ const k=mh.time.indexOf(P.H.time[i]);

        if(slm&&slm[k]!=null){ const cur=slm[k],prev=k>0?slm[k-1]:null,next=k<slm.length-1?slm[k+1]:null; let kind=''; if(prev!=null&&next!=null){ if(cur>=prev&&cur>=next)kind='high'; else if(cur<=prev&&cur<=next)kind='low'; } tide={cur,trend:prev!=null?cur-prev:0,kind}; } }
    }
    let sun=''; if(hr===srH) sun=`<div class="sun">${ICON_SUNRISE} Alba ${hhmm(sr)}</div>`; else if(hr===ssH) sun=`<div class="sun">${ICON_SUNSET} Tram. ${hhmm(ss)}</div>`;
    h+=`<div class="hcell"><div class="h">${i===P.idxNow?"Ora":hr+":00"}</div>

      ${tide?`<div class="tide">${tide.kind==='high'?'🔼 <b>Alta marea</b>':tide.kind==='low'?'🔽 <b>Bassa marea</b>':(tide.trend>=0?'▲ Montante':'▼ Calante')}</div>`:''}

function buildDaily(P){

function marineNow(){
  const M=STATE.marine; if(!M||!M.hourly||!M.hourly.wave_height) return null;
  const now=new Date(); let i=0; for(let k=0;k<M.hourly.time.length;k++){ if(new Date(M.hourly.time[k])<=now) i=k; else break; }
  const wh=M.hourly.wave_height[i]; const st=seaState(wh); if(st==null) return null;

  return {st,wh,wd:M.hourly.wave_direction?M.hourly.wave_direction[i]:null,wp:M.hourly.wave_period?M.hourly.wave_period[i]:null,sh:M.hourly.swell_wave_height?M.hourly.swell_wave_height[i]:null,i,tide};
}

// ---- Avvisi automatici + fase lunare ----
function moonPhase(date){
  const syn=29.530588853;
  const ref=Date.UTC(2000,0,6,18,14)/86400000;
  const now=date.getTime()/86400000;
  const age=((now-ref)%syn+syn)%syn;
  const illum=Math.round((1-Math.cos(2*Math.PI*age/syn))/2*100);
  const ph=[["Luna nuova","🌑"],["Luna crescente","🌒"],["Primo quarto","🌓"],["Gibbosa crescente","🌔"],["Luna piena","🌕"],["Gibbosa calante","🌖"],["Ultimo quarto","🌗"],["Luna calante","🌘"]];
  const idx=Math.round(age/syn*8)%8;
  return {name:ph[idx][0],emoji:ph[idx][1],illum,age:Math.floor(age)};
}
function renderBottom(){
  const el=$("#bottom"); if(!STATE.data){ el.innerHTML=''; return; }
  const P=prep(); const i0=P.idxNow, i1=Math.min(i0+24,P.H.time.length);
  let gust=0,rain=0,thunder=false,tmaxv=-99,tminv=99,wave=0;
  for(let i=i0;i<i1;i++){
    const g=consensusAt(P.wgH,i).v; if(g!=null&&g>gust)gust=g;
    const r=consensusAt(P.prH,i).v; if(r!=null&&r>rain)rain=r;
    if(codeAt(P.wcH,i)>=95)thunder=true;
    const tt=consensusAt(P.tH,i).v; if(tt!=null){ if(tt>tmaxv)tmaxv=tt; if(tt<tminv)tminv=tt; }
  }
  if(STATE.marine&&STATE.marine.hourly&&STATE.marine.hourly.wave_height){
    const wh=STATE.marine.hourly.wave_height;
    for(let i=0;i<Math.min(24,wh.length);i++){ if(wh[i]!=null&&wh[i]>wave)wave=wh[i]; }
  }
  const al=[];
  if(thunder) al.push(['red','⛈️','Rischio temporali nelle prossime 24 ore']);
  if(gust>=34) al.push(['red','💨',`Vento forte: raffiche fino a ${Math.round(gust)} kn`]);
  else if(gust>=22) al.push(['','💨',`Vento teso: raffiche fino a ${Math.round(gust)} kn`]);
  if(rain>=8) al.push(['red','🌧️',`Pioggia intensa: fino a ${rain.toFixed(1)} mm/h`]);
  else if(rain>=3) al.push(['','🌧️',`Possibili rovesci: fino a ${rain.toFixed(1)} mm/h`]);
  if(wave>=2.5) al.push(['red','🌊',`Mare agitato: onde fino a ${wave.toFixed(1)} m`]);
  else if(wave>=1.25) al.push(['','🌊',`Mare mosso: onde fino a ${wave.toFixed(1)} m`]);
  if(tmaxv>=35) al.push(['red','🥵',`Caldo intenso: fino a ${Math.round(tmaxv)}°`]);
  if(tminv<=-5) al.push(['red','🥶',`Freddo intenso: fino a ${Math.round(tminv)}°`]);
  const mdstr=STATE.data.daily.time[STATE.selDay]||STATE.data.daily.time[0];
  const md=new Date(mdstr+"T12:00");
  const mdn=STATE.selDay===0?"oggi":(STATE.selDay===1?"domani":md.toLocaleDateString('it-IT',{weekday:'long'}));
  const m=moonPhase(md);
  let h=`<div class="card"><h2 class="sec">⚠️ Avvisi & 🌙 Luna</h2>`;
  h+= al.length ? al.map(a=>`<div class="alert ${a[0]}">${a[1]} ${a[2]}</div>`).join('')
                : `<div class="alert ok">✅ Nessun avviso meteo rilevante nelle prossime 24 ore</div>`;
  h+=`<div class="moon" style="margin-top:12px"><div class="mi">${m.emoji}</div>
    <div><b>${m.name}</b> <span class="muted">(${mdn})</span><div class="sub">Illuminazione ${m.illum}% · giorno ${m.age} del ciclo lunare</div></div></div>`;
  h+=`<div class="sub" style="margin-top:12px">Gli avvisi sono calcolati automaticamente dai dati di previsione. Per le <b>allerte ufficiali</b> della Protezione Civile (Emilia-Romagna) consulta <a href="https://allertameteo.regione.emilia-romagna.it/" target="_blank" rel="noopener" style="color:var(--acc)">allertameteo.regione.emilia-romagna.it</a>.</div></div>`;
  el.innerHTML=h;
}

// ---- Flusso ----
async function refresh(){
  $("#content").innerHTML=`<div class="loader"><div class="spin"></div>Confronto di tutte le fonti meteo…</div>`;
  try{
    STATE.data=await loadWeather(STATE.lat,STATE.lon);
    STATE.marine=await loadMarine(STATE.lat,STATE.lon);
    renderPlaceline(); renderTabs(); renderContent(); renderBottom(); showMap();
  }catch(e){
    $("#content").innerHTML=`<div class="err">Impossibile caricare i dati: ${e.message}.<br>Controlla la connessione e riprova.</div>`;
  }
}
function setPlace(lat,lon,name){
  STATE.lat=lat;STATE.lon=lon;STATE.place=name;STATE.selDay=0;
  try{localStorage.setItem('mp_last',JSON.stringify({lat,lon,name}));}catch(e){}
  addRecent({lat,lon,name}); renderRecent(); renderPlaceline();
  if(MAP){ MAP.setView([lat,lon],11); }
  refresh();
}

// GPS
$("#geoBtn").addEventListener('click',()=>{
  if(!navigator.geolocation){alert("Geolocalizzazione non disponibile");return;}
  $("#content").innerHTML=`<div class="loader"><div class="spin"></div>Rilevamento posizione…</div>`;
  navigator.geolocation.getCurrentPosition(
    p=>setPlace(p.coords.latitude,p.coords.longitude,"La mia posizione"),
    ()=>{ $("#content").innerHTML=`<div class="err">Posizione non concessa. Cerca una città in alto.</div>`; },
    {enableHighAccuracy:true,timeout:10000});
});

// Ricerca città
let sugTimer=null;
$("#q").addEventListener('input',()=>{
  clearTimeout(sugTimer); const v=$("#q").value.trim();
  if(v.length<2){$("#sug").style.display="none";return;}
  sugTimer=setTimeout(async()=>{
    try{
      const res=await geocode(v); if(!res.length){$("#sug").style.display="none";return;}
      $("#sug").innerHTML=res.map(r=>{const lbl=[r.name,r.admin1,r.country].filter(Boolean).join(", ");
        return `<div data-lat="${r.latitude}" data-lon="${r.longitude}" data-nm="${lbl.replace(/"/g,'')}">${lbl}</div>`;}).join("");
      $("#sug").style.display="block";
      document.querySelectorAll('#sug div').forEach(d=>d.addEventListener('click',()=>{
        $("#sug").style.display="none"; $("#q").value=d.dataset.nm;
        setPlace(+d.dataset.lat,+d.dataset.lon,d.dataset.nm);
      }));
    }catch(e){}
  },280);
});
document.addEventListener('click',e=>{if(!e.target.closest('.suggest'))$("#sug").style.display="none";});

// ---- Avvio (dopo sblocco) ----
function startApp(){
  loadFavs(); loadRecent(); renderFavs(); renderRecent();
  let last=null; try{last=JSON.parse(localStorage.getItem('mp_last'));}catch(e){}
  if(last&&last.lat){ setPlace(last.lat,last.lon,last.name); return; }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>setPlace(p.coords.latitude,p.coords.longitude,"La mia posizione"),
      ()=>setPlace(44.0807,12.5276,"Viserba (Rimini)"),
      {timeout:8000});
  } else setPlace(44.0807,12.5276,"Viserba (Rimini)");
}

// ====== BLOCCO PASSWORD ======
const PASS_HASH="2fdf5a81c014514a9f3f26d6f6ca84ffebec18807b0612c07e27dc2790588e53";
function sha256js(ascii){
  function rightRotate(value,amount){return (value>>>amount)|(value<<(32-amount));}
  var mathPow=Math.pow;var maxWord=mathPow(2,32);var result='';
  var words=[];var asciiBitLength=ascii.length*8;
  var hash=sha256js.h=sha256js.h||[];var k=sha256js.k=sha256js.k||[];var primeCounter=k.length;
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8)return;
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=((asciiBitLength/maxWord)|0);
  words[words.length]=(asciiBitLength);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16);
    var oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]
        +(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=i<16?w[i]:(
            w[i-16]
            +(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))
            +w[i-7]
            +(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10))
          )|0
        );
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))
        +((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}
function unlock(){ const l=$("#lock"); if(l) l.style.display='none'; startApp(); }
function tryPass(){
  const inp=$("#pw"), err=$("#pwErr");
  const val=(inp.value||'').trim().toUpperCase();
  if(sha256js(val)===PASS_HASH){ const rem=$("#rem"); if(rem&&rem.checked){ try{localStorage.setItem('mp_remember','ok');}catch(e){} } unlock(); }
  else { err.textContent='Password errata'; inp.value=''; inp.focus(); }
}
(function lockInit(){
  let ok=false; try{ok=localStorage.getItem('mp_remember')==='ok';}catch(e){}
  if(ok){ unlock(); return; }
  const btn=$("#pwBtn"), inp=$("#pw");
  if(btn) btn.addEventListener('click',tryPass);
  if(inp){ inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryPass(); }); inp.focus(); }
})();
</script>
